name: Build and Release DMG

on:
  push:
    tags:
      - 'v*' # Si attiva automaticamente quando fai il push di un tag che inizia per 'v' (es. v1.0.0)

jobs:
  release:
    name: Build Universal Binary & Create DMG
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer # O lascia la versione di default di macos-latest

      - name: Build Universal Binary and Bundle App
        run: |
          chmod +x scripts/*.sh
          sh scripts/build-app.sh

      - name: Create DMG package
        run: |
          sh scripts/build-dmg.sh

      - name: Release and Upload DMG
        uses: softprops/action-gh-release@v1
        with:
          files: ConCopy-*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}