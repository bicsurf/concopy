name: Build and Release DMG

on:
  push:
    tags:
      - 'v*'

permissions:
    contents: write

jobs:
  release:
    name: Build Universal Binary & Create DMG
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Universal App & Create DMG
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-dmg.sh

      - name: Release and Upload DMG
        uses: softprops/action-gh-release@v1
        with:
          files: ConCopy-*.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated Homebrew Cask
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/concopy.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): aggiorna Homebrew Cask a v${GITHUB_REF_NAME#v} [skip ci]"
            git push origin HEAD:main
          fi