name: Release ConCopy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          swift --version

      - name: Run Unit & Integration Tests
        run: |
          swift test --parallel

      - name: Build ConCopy in Release Mode
        run: |
          swift build -c release

      - name: Prepare Keychain & Import Signing Certificate
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD=$(uuidgen)
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Assemble Application Bundle (.app)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

          APP_DIR="ConCopy.app"
          CONTENTS_DIR="${APP_DIR}/Contents"
          MACOS_DIR="${CONTENTS_DIR}/MacOS"
          RESOURCES_DIR="${CONTENTS_DIR}/Resources"

          mkdir -p "${MACOS_DIR}" "${RESOURCES_DIR}"
          cp ".build/release/ConCopyApp" "${MACOS_DIR}/ConCopyApp"
          chmod +x "${MACOS_DIR}/ConCopyApp"

          cp "Sources/ConCopyApp/Info.plist" "${CONTENTS_DIR}/Info.plist"
          plutil -replace CFBundleExecutable -string "ConCopyApp" "${CONTENTS_DIR}/Info.plist"
          plutil -replace CFBundleShortVersionString -string "${VERSION}" "${CONTENTS_DIR}/Info.plist"
          plutil -replace CFBundleVersion -string "${GITHUB_RUN_NUMBER}" "${CONTENTS_DIR}/Info.plist"
          echo -n "APPL????" > "${CONTENTS_DIR}/PkgInfo"

      - name: Sign Application Bundle
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          if [ -n "$APPLE_DEVELOPER_ID" ] && [ -f "$KEYCHAIN_PATH" ]; then
            echo "Codesigning with Developer ID: $APPLE_DEVELOPER_ID"
            codesign --force --deep --options runtime --timestamp \
              --sign "$APPLE_DEVELOPER_ID" --keychain "$KEYCHAIN_PATH" "ConCopy.app"
          else
            echo "Signing with ad-hoc identity"
            codesign --force --deep --sign - "ConCopy.app"
          fi
          codesign --verify --deep --strict --verbose=2 "ConCopy.app"

      - name: Package into DMG
        run: |
          DMG_STAGING="dmg_staging"
          DMG_NAME="ConCopy-${APP_VERSION}-macOS.dmg"
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

          mkdir -p "${DMG_STAGING}"
          cp -R "ConCopy.app" "${DMG_STAGING}/"
          ln -s /Applications "${DMG_STAGING}/Applications"

          hdiutil create -volname "ConCopy" -srcfolder "${DMG_STAGING}" -ov -format UDZO "${DMG_NAME}"
          rm -rf "${DMG_STAGING}"

      - name: Sign DMG
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          if [ -n "$APPLE_DEVELOPER_ID" ] && [ -f "$KEYCHAIN_PATH" ]; then
            echo "Codesigning DMG..."
            codesign --force --sign "$APPLE_DEVELOPER_ID" --timestamp \
              --keychain "$KEYCHAIN_PATH" "${DMG_NAME}"
          fi

      - name: Notarize DMG with Apple notarytool
        if: env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "Submitting DMG to Apple Notarization Service..."
          xcrun notarytool submit "${DMG_NAME}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "Stapling notarization ticket to DMG..."
          xcrun stapler staple "${DMG_NAME}"
          spctl --assess --type open --context context:primary-signature --verbose=2 "${DMG_NAME}" || true

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ConCopy ${{ env.APP_VERSION }}"
          files: ${{ env.DMG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
