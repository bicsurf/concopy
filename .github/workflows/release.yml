name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.3.8)'
        required: true
        default: 'v1.3.8'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve Version Tag
        id: vars
        env:
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: bash scripts/resolve-release-tag.sh

      - name: Check Swift Concurrency
        run: swift build -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors

      - name: Test Release Scripts
        run: bash scripts/tests/release-scripts-tests.sh

      - name: Run Test Suite Gate
        run: swift test

      - name: Build Universal App
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Package Release Artifacts (.dmg and .zip)
        env:
          APP_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          DMG_NAME="ConCopy-${APP_VERSION}.dmg"
          ZIP_NAME="ConCopy-${APP_VERSION}.zip"
          STAGING_DIR="build/dmg-staging"

          rm -rf "$STAGING_DIR" "$DMG_NAME" "$ZIP_NAME"
          mkdir -p "$STAGING_DIR"

          echo "==> Staging ConCopy.app..."
          cp -R "ConCopy.app" "$STAGING_DIR/"
          ln -s /Applications "$STAGING_DIR/Applications"

          echo "==> Creating DMG ($DMG_NAME)..."
          hdiutil create -volname "ConCopy" \
            -srcfolder "$STAGING_DIR" \
            -ov -format UDZO \
            "$DMG_NAME"

          echo "==> Creating ZIP ($ZIP_NAME)..."
          ditto -c -k --sequesterRsrc --keepParent "ConCopy.app" "$ZIP_NAME"

          echo "==> Generating SHA256 checksums..."
          shasum -a 256 "$DMG_NAME" "$ZIP_NAME" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag }}
          APP_VERSION: ${{ steps.vars.outputs.version }}
        run: |
          DMG_NAME="ConCopy-${APP_VERSION}.dmg"
          ZIP_NAME="ConCopy-${APP_VERSION}.zip"

          echo "==> Publishing GitHub Release for $TAG..."
          gh release create "$TAG" \
            --latest \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "$DMG_NAME" \
            "$ZIP_NAME" \
            SHA256SUMS.txt
