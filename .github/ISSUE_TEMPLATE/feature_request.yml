name: Feature Request
description: Suggest an idea or enhancement for ConCopy
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea or improvement for ConCopy!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or friction is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear and concise description of what you want to happen.
      placeholder: Describe the requested feature or improvement...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives Considered
      description: Any alternative solutions or features you've considered.
      placeholder: Other ways to address this...
    validations:
      required: false

  - type: dropdown
    id: macos-version
    attributes:
      label: Target macOS Version
      description: Which macOS version do you primarily use?
      options:
        - "macOS 26 Tahoe"
        - "macOS 15 Sequoia"
        - "macOS 14 Sonoma"
        - "macOS 27 / Pre-release"
        - "All supported versions"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: Your Mac CPU architecture.
      options:
        - "Apple Silicon (M1/M2/M3/M4/M5)"
        - "Intel (x86_64)"
        - "Both / Universal"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or other context about the feature request here.
      placeholder: Optional extra details...
    validations:
      required: false