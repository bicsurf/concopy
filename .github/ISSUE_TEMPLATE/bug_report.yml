name: Bug Report
description: Create a report to help us improve ConCopy
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open ConCopy using shortcut (⌘⇧V)
        2. Copy something...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
      placeholder: What should have happened instead...
    validations:
      required: true

  - type: dropdown
    id: macos-version
    attributes:
      label: macOS Version
      description: Select your macOS version.
      options:
        - "macOS 26 Tahoe"
        - "macOS 15 Sequoia"
        - "macOS 14 Sonoma"
        - "macOS 27 / Pre-release"
        - "Other / Older (unsupported)"
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      description: Select your Mac CPU architecture.
      options:
        - "Apple Silicon (M1/M2/M3/M4/M5)"
        - "Intel (x86_64)"
    validations:
      required: true

  - type: input
    id: concopy-version
    attributes:
      label: ConCopy Version
      description: What version of ConCopy are you using? (Check Settings → About or DMG tag)
      placeholder: "e.g., 1.3.2 or git commit hash"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Additional Context
      description: Console logs or extra context if applicable.
      placeholder: Paste any error messages or logs here...
    validations:
      required: false